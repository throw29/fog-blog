# /etc/nginx/sites-available/blog.conf
# 与 Halo 2.22.13 共用域名，挂在 /blog/ 子路径下做登录保护
#
# 前置条件：
#  1. Halo 已在 example.com 上跑（默认 8090 端口，Nginx 反代）
#  2. 你希望访客通过 https://example.com/blog/ 访问博客
#  3. 博客通过 Gunicorn 在 127.0.0.1:8000 监听（systemd 配置见 blog.service）
#
# 集成步骤：
#  1. 在 Halo 现有的 server block（443）里加 location /blog/ 块（用本文件 proxy_params）
#     或者用独立 server 监听 8001 端口（更简单，但需要改 DNS）
#  2. 修改 app.py 加 APPLICATION_ROOT='/blog' 或 DispatcherMiddleware
#  3. 重新加载 nginx + 重启 blog

# 方式 A：附加到 Halo 现有 server block（在 443 server 块里加下面这段）
#       ----
#       location /blog/ {
#           # 转发到博客的 Gunicorn
#           proxy_pass http://127.0.0.1:8000/;
#           proxy_http_version 1.1;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_set_header X-Script-Name /blog;  # 关键！让 Flask 知道自己在子路径下
#           proxy_redirect off;
#       }
#       ----

# 方式 B：博客独立子域名（推荐，更简单）
#       改用 nginx.conf，并在 certbot --nginx 时一起签证书

# 关键提示：Flask 子路径部署需要 SCRIPT_NAME 支持
# app.py 增加：
#   from werkzeug.middleware.dispatcher import DispatcherMiddleware
#   from werkzeug.wrappers import Response
#   app.wsgi_app = DispatcherMiddleware(
#       lambda: Response("Not Found", status=404),
#       {"/blog": app.wsgi_app}
#   )
# 或者更简单（Flask 2.0+）：app.config['APPLICATION_ROOT'] = '/blog'
# 然后所有 url_for() 会自动加 /blog 前缀

# 本文件只作为参考示例，不要直接 cp 到生产环境
