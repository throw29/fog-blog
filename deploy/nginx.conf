# /etc/nginx/sites-available/blog.conf
# 独立子域名 / 顶级域名部署

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;  # TODO: 改成你的域名

    # 加密上传时的可读报错
    client_max_body_size 50M;
    client_body_timeout 60s;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 访问日志
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # 静态资源：Nginx 直出（不走 Flask，提高性能 + 减少 CPU）
    location /static/ {
        alias /var/www/blog/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 上传文件（用户头像、PDF 文档等）：缓存 7 天
    location /uploads/ {
        alias /var/www/blog/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查端点（如果你加了 /healthz）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 其它全部走 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 长连接（PDF 渲染、CDP 截图等长请求友好）
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
