# 通用 SSL 配置片段（被 blog HTTPS server block include）
# Modern profile（SSL Labs A 级），TLS 1.2 + 1.3，禁用压缩防 CRIME。

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# ssl_ciphersuites（TLS 1.3 套件显式优先）：Ubuntu nginx 1.24 包未编译此指令支持
# （实测 unknown directive）。注释掉让 OpenSSL 自动协商 TLS 1.3 套件，
# 仍满足 SSL Labs A 级安全性。要启用请确认 nginx -V 含 --with-openssl
# 链接 OpenSSL >= 1.1.1。
# ssl_ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# HSTS —— 一旦启用浏览器将强制 HTTPS 一年；谨慎：先确保全部子域都准备好
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 安全相关响应头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
